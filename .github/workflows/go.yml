# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: golang pure build

on:
  workflow_dispatch: 
    inputs:
      build_tag: 
        description: '编译版本标签 (例如: v1.0.1)'
        required: true
        default: 'latest'

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.2'
        cache: true

    - name: Build Static Binary
      env:
        CGO_ENABLED: 0
        GOOS: linux
        GOARCH: amd64
      run: |
        go build -ldflags="-s -w -X main.Version=${{ github.event.inputs.build_tag }}" -o nacos_util main.go
        sha256sum nacos_util > sha256.txt

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.build_tag }}
        name: nacos-util-${{ github.event.inputs.build_tag }}
        draft: false
        prerelease: false
        files: |
          nacos_util
          sha256.txt
        


